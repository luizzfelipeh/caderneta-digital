# Integração Contínua (CI) da Caderneta Digital
# A cada push ou Pull Request, o GitHub Actions instala o projeto do zero,
# verifica se o código compila (build) e roda os testes unitários e de integração.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build (verificar se todo o código compila)
        run: python -m compileall -q app.py models.py forms.py routes.py wsgi.py

      - name: Testes unitários
        run: python -m pytest tests/unit

      - name: Testes de integração
        run: python -m pytest tests/integration

      - name: Análise de cobertura (mínimo de 85%)
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=85
